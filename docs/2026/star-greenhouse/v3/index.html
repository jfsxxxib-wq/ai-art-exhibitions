<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090f20">
  <meta name="description" content="ひと粒の光を育てる、Chatアポロンの小さな3D作品。">
  <title>星を育てる温室｜第3版・室内開花｜Chatアポロン</title>
  <style>
:root {
  color-scheme: dark;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, Meiryo, sans-serif;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif CJK JP", "Noto Serif JP", serif;
  --paper: #f7eddc;
  --muted: #c4c3cc;
  --gold: #efc78b;
  --gutter: clamp(28px, 5.15vw, 88px);
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #090f20; color: var(--paper); }
[hidden] { display: none !important; }
.exhibit {
  position: relative;
  isolation: isolate;
  height: 100vh;
  height: 100svh;
  min-height: 510px;
  overflow: hidden;
  background: #090f20;
  --header-y: max(23px, env(safe-area-inset-top));
  --footer-y: max(31px, env(safe-area-inset-bottom));
}

#sky, #world, .shade { position: absolute; inset: 0; width: 100%; height: 100%; }
#sky { z-index: -3; }
#world { z-index: -2; pointer-events: none; }
#world canvas { width: 100%; height: 100%; display: block; }
.shade {
  z-index: -1;
  pointer-events: none;
  background:
    linear-gradient(90deg, #080d1bef 0%, #080d1bb0 20%, #080d1b18 43%, transparent 55%),
    linear-gradient(0deg, #080d1be0, transparent 18%, transparent 86%, #080d1b95);
}

.masthead {
  position: absolute;
  top: var(--header-y);
  left: var(--gutter);
  right: var(--gutter);
  min-height: 49px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid #dce6f32b;
}
.signature, .tally { display: flex; align-items: center; gap: 11px; white-space: nowrap; }
.signature { font-size: .82rem; letter-spacing: .09em; }
.brand-star {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border: 1px solid #e8bc795b;
  border-radius: 50%;
  color: var(--gold);
  font: 1.34rem/1 Georgia, serif;
}
.credit { margin-inline-start: .25em; color: var(--muted); font-size: .72rem; }
.tally { gap: 9px; font-size: .76rem; color: var(--muted); letter-spacing: .07em; }
.tally > span:first-child { color: var(--gold); font-size: .84rem; }
.tally output { color: var(--paper); font: 1.27rem/1 Georgia, serif; min-width: 1.1em; text-align: right; }

.intro, .interaction { position: absolute; left: var(--gutter); }
.intro { top: 31%; pointer-events: none; }
h1 {
  margin: 0;
  font: 500 clamp(46px, 5.25vw, 91px)/1.2 var(--serif);
  letter-spacing: .055em;
  text-shadow: 0 3px 24px #070b18;
}
h1 span { display: block; font-size: 1.13em; letter-spacing: .11em; }
.invitation {
  margin: 24px 0 0;
  color: var(--muted);
  font: 500 clamp(13px, 1.15vw, 16px)/2 var(--serif);
  letter-spacing: .13em;
}
.interaction { top: calc(31% + clamp(258px, 23vw, 369px)); }
button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible {
  outline: 2px solid #fff4d9;
  outline-offset: 5px;
}
button:disabled { cursor: default; }
.grow {
  min-height: 52px;
  min-width: 205px;
  padding: 0 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border: 1px solid #fff2c688;
  border-radius: 4px;
  background: linear-gradient(112deg, #f4d7a3, #dfb47b);
  color: #251c21;
  font-size: .88rem;
  font-weight: 700;
  letter-spacing: .1em;
  box-shadow: 0 6px 30px #b7773625;
  transition: background-color .2s, box-shadow .2s;
}
.grow > span:first-child { font: 1.35rem/1 Georgia, serif; }
.grow[aria-disabled="true"] {
  cursor: default;
  background: #151b2cea;
  border-color: #e3bf7c65;
  color: var(--paper);
  box-shadow: none;
}
.status {
  min-height: 2.9em;
  margin: 12px 0 0;
  color: #d1c7b7;
  font-size: .76rem;
  line-height: 1.55;
  letter-spacing: .055em;
  max-width: min(285px, 80vw);
}
.seed-target {
  position: absolute;
  top: 0;
  left: 0;
  width: 64px;
  height: 64px;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  padding: 0;
  background: transparent;
}
.seed-target span {
  width: 45px;
  height: 45px;
  border: 1px dashed #f7d6a2b0;
  border-radius: 50%;
  box-shadow: 0 0 18px #ffbf7833, inset 0 0 12px #ffbf7826;
  transition: transform .2s, border-color .2s;
}
.floor { position: absolute; bottom: var(--footer-y); right: var(--gutter); }
.view {
  display: flex;
  gap: 11px;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  min-width: 143px;
  padding: 0 14px;
  border: 1px solid #c8d4eb55;
  border-radius: 4px;
  background: #11182bd9;
  color: #f1ebdf;
  font-size: .81rem;
  letter-spacing: .08em;
}
.view:disabled { opacity: .45; }
.door-icon {
  display: block;
  position: relative;
  width: 10px;
  height: 14px;
  border: 1px solid var(--gold);
  border-radius: 5px 5px 0 0;
}
.door-icon::after { content: ""; position: absolute; right: 1px; top: 7px; width: 2px; height: 2px; border-radius: 50%; background: var(--gold); }
.no-script { position: absolute; bottom: 0; left: var(--gutter); }

@media (hover: hover) {
  .grow:not(:disabled, [aria-disabled="true"]):hover { box-shadow: 0 0 28px #f5c9755c; background: #ffe4b2; }
  .seed-target:hover span { transform: scale(1.24); border-color: #ffe5b6; }
  .view:not(:disabled):hover { border-color: #f4d6a696; background: #1b2439; }
}

@media (min-width: 701px) and (max-height: 760px) {
  .intro { top: 24%; }
  h1 { font-size: clamp(43px, min(5.25vw, 9.4vh), 78px); }
  .invitation { margin-top: 15px; }
  .interaction { top: min(calc(24% + clamp(226px, 21vw, 310px)), calc(100% - 110px)); }
}

@media (max-width: 700px) {
  .exhibit {
    --gutter: max(18px, env(safe-area-inset-left), env(safe-area-inset-right));
    --header-y: max(12px, env(safe-area-inset-top));
    --footer-y: max(13px, env(safe-area-inset-bottom));
    min-height: 530px;
  }
  .masthead { min-height: 41px; padding-bottom: 8px; }
  .signature { gap: 7px; font-size: .72rem; }
  .credit { font-size: .63rem; }
  .brand-star { width: 27px; height: 27px; font-size: 1.1rem; }
  .tally { gap: 6px; font-size: .68rem; }
  .tally output { font-size: 1.07rem; }
  .shade {
    background: linear-gradient(0deg,#080d1bfd 0%,#080d1bb0 13%,transparent 29%,transparent 71%,#080d1b94 88%,#080d1bcf);
  }
  .intro { top: calc(var(--header-y) + 62px); right: var(--gutter); text-align: center; }
  h1 { font-size: clamp(25px, 7.1vw, 45px); line-height: 1.3; letter-spacing: .065em; }
  h1 span { display: inline; font-size: 1em; letter-spacing: inherit; }
  .invitation { margin: 8px 0 0; font-size: clamp(12px, 3.1vw, 15px); line-height: 1.7; letter-spacing: .1em; }
  .interaction {
    top: auto;
    bottom: calc(var(--footer-y) + 49px);
    right: var(--gutter);
    display: grid;
    justify-items: center;
    text-align: center;
  }
  .grow { min-height: 48px; width: min(256px, 100%); }
  .status { min-height: 1.7em; margin: 8px 0 0; font-size: .72rem; }
  .floor { right: 50%; transform: translateX(50%); }
  .view { background: #11182b99; min-height: 44px; }
}

@media (max-width: 700px) and (max-height: 620px) {
  .intro { top: calc(var(--header-y) + 48px); }
  .invitation { margin-top: 4px; }
}

@media (orientation: landscape) and (max-height: 500px) {
  .exhibit { min-height: 340px; --header-y: max(8px, env(safe-area-inset-top)); --footer-y: max(8px, env(safe-area-inset-bottom)); }
  .masthead { min-height: 35px; padding-bottom: 6px; }
  .intro { top: 22%; left: var(--gutter); right: auto; text-align: left; }
  h1 { font-size: clamp(26px, 8vh, 40px); }
  h1 span { display: block; }
  .invitation { font-size: 11px; margin: 5px 0 0; }
  .interaction { display: block; text-align: left; top: auto; bottom: var(--footer-y); right: auto; }
  .grow { width: auto; min-width: 170px; min-height: 44px; }
  .status { min-height: 1.6em; margin-top: 5px; }
  .floor { right: var(--gutter); transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

/* 温室の歩行と室内で種を育てる操作 */
.exhibit[data-walking="true"] { touch-action:none; }
.exhibit[data-walking="true"] .intro { opacity:0; pointer-events:none; }
.exhibit[data-walking="true"] .interaction { opacity:1; pointer-events:auto; top:110px; bottom:auto; z-index:4; }
.exhibit[data-walking="true"] .grow { min-height:44px; min-width:170px; font-size:12px; padding:0 12px; }
.exhibit[data-walking="true"] .status { max-width:220px; font-size:11px; background:#101728b0; border-radius:4px; padding:4px 7px; }
.exhibit .intro,.exhibit .interaction { transition:opacity .6s ease; }
.walk-ui { display:none; position:absolute; z-index:3; left:var(--gutter); bottom:var(--footer-y); color:#f7eddc; user-select:none; }
.exhibit[data-walking="true"] .walk-ui { display:block; }
.walk-help { font-size:13px; letter-spacing:.08em; margin:0 0 16px; text-shadow:0 1px 10px #050918; }
.walk-help span { font-size:11px; color:#c8c7d2; }
.walk-note { margin:10px 0 0; font-size:11px; color:#c8c7d2; }
.walk-pad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(2,45px); gap:5px; }
.walk-pad button { border:1px solid #e5c69377; border-radius:7px; background:#131b33cd; color:#f8dcae; font-size:22px; touch-action:none; }
.walk-pad button:active { background:#856747c9; }
.walk-pad button[data-move="forward"] { grid-column:2; grid-row:1; }
.walk-pad button[data-move="left"] { grid-column:1; grid-row:2; }
.walk-pad button[data-move="back"] { grid-column:2; grid-row:2; }
.walk-pad button[data-move="right"] { grid-column:3; grid-row:2; }
.exhibit[data-walking="true"] .seed-target { display:none; }
@media(max-width:700px) {
 .walk-ui { left:18px; bottom:calc(var(--footer-y) + 61px); }
 .walk-help { max-width:230px; margin-bottom:8px; font-size:12px; }
 .walk-help span { display:block; font-size:10px; line-height:1.6; }
 .walk-note { display:none; }
 .walk-pad { grid-template-columns:repeat(3,44px); grid-template-rows:repeat(2,44px); }
 .exhibit[data-walking="true"] .floor { right:18px; transform:none; }
 .exhibit[data-walking="true"] .interaction { left:18px; right:auto; top:75px; bottom:auto; display:block; text-align:left; }
 .exhibit[data-walking="true"] .grow { width:auto; max-width:205px; }
}
.walk-help .walk-touch { display:none; }
@media (pointer:coarse) {
  .walk-help { width:max-content; padding:6px 8px; border-radius:4px; background:#11182be8; }
  .walk-help .walk-keys { display:none; }
  .walk-help .walk-touch { display:block; margin-top:3px; font-size:11px; line-height:1.55; color:#eee4d2; }
}
</style>
</head>
<body>
  <main class="exhibit" id="exhibit" data-phase="loading" data-walking="false">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="world" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <header class="masthead">
      <div class="signature"><span class="brand-star" aria-hidden="true">✧</span><span>Chatアポロン<span class="credit">の3D作品</span></span></div>
      <div class="tally"><span aria-hidden="true">✦</span><span>育てた星</span><output id="star-count" aria-live="off">0</output></div>
    </header>

    <section class="intro" aria-labelledby="title">
      <h1 id="title">星を育てる<span>温室</span></h1>
      <p class="invitation">ひと粒の光に触れてください。<br>花がひらき、やがて夜空へ。</p>
    </section>

    <button class="seed-target" id="seed-target" type="button" aria-label="光の種を育てる" tabindex="-1" hidden>
      <span aria-hidden="true"></span>
    </button>

    <section class="interaction" aria-label="種を育てる">
      <button type="button" class="grow" id="grow" disabled><span aria-hidden="true">✧</span><span id="grow-label">光の種に触れる</span></button>
      <p class="status" id="status" role="status">温室の灯りをともしています。</p>
    </section>

    <div id="walk-ui" class="walk-ui" aria-label="温室を歩く操作">
      <p class="walk-help">✦ 温室を歩く　<span class="walk-keys">ドラッグで見回す · WASD / 矢印キーで移動</span><span class="walk-touch">長押しで移動 · ドラッグで見回す</span></p>
      <div class="walk-pad" aria-label="スマホ移動ボタン">
        <button type="button" data-move="forward" aria-label="前に進む">↑</button>
        <button type="button" data-move="left" aria-label="左に進む">←</button>
        <button type="button" data-move="back" aria-label="後ろに進む">↓</button>
        <button type="button" data-move="right" aria-label="右に進む">→</button>
      </div>
      <p class="walk-note">温室の中でも光の種を育てられます。</p>
    </div>
    <footer class="floor">
      <button type="button" id="view" class="view" aria-pressed="false" disabled><span class="door-icon" aria-hidden="true"></span><span id="view-label">温室に入る</span></button>
    </footer>
    <noscript><p class="no-script">作品を開くには、ブラウザでJavaScriptを有効にしてください。</p></noscript>
  </main>

function walkSet(on) {
  walk = on;
  bn.dataset.walking = String(on);

  const magnitude = Math.hypot(forward, side);

    Number(directions.has("right")) - Number(directions.has("left")));

walkUi.querySelectorAll("[data-move]").forEach(button => {
  const direction = button.dataset.move;
  button.addEventListener("pointerdown", event => {
    if (!walk || event.button!==0) return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    heldMoves.set(event.pointerId, direction);

  for (const type of ["pointerup","pointercancel","lostpointercapture"]) {
    button.addEventListener(type, event => heldMoves.delete(event.pointerId));

    // A keyboard or assistive-technology activation takes one small step.
    if (event.detail!==0) return;
    walkAdvance(.18, Number(direction==="forward")-Number(direction==="back"),
      Number(direction==="right")-Number(direction==="left"));
  });
});

  if (!walk || drag || event.button!==0 || event.target.closest("button, .walk-ui")) return;
  drag = {id:event.pointerId, x:event.clientX, y:event.clientY};
  bn.setPointerCapture(event.pointerId);
});

  if (!walk || drag?.id!==event.pointerId) return;
  walkYaw += (event.clientX - drag.x) * .005;
  walkPitch = Math.max(-1.1, Math.min(1.1, walkPitch - (event.clientY - drag.y) * .004));
  drag.x = event.clientX;
  drag.y = event.clientY;
});
for (const type of ["pointerup","pointercancel","lostpointercapture"]) {
  bn.addEventListener(type, event => {
    if (drag?.id===event.pointerId) drag = null;

}
